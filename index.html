<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Vert 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background-color: #000000; 
            display: flex;
        }
        #menu {
            width: 200px;
            height: 100vh;
            background-color: #1a1a1a;
            padding: 10px;
            border-right: 1px solid #333;
        }
        #menu h2 {
            color: #ccc;
            font-size: 16px;
            margin-bottom: 15px;
        }
        #menu button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            background-color: #2a2a2a;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
        }
        #menu button:hover {
            background-color: #3a3a3a;
        }
        #menu button.active {
            background-color: #006600;
        }
        #canvas-container {
            flex: 1;
            height: 100vh;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="menu">
        <h2>Formes</h2>
        <button onclick="addShape('cube')">Cube</button>
        <button onclick="addShape('sphere')">Sphère</button>
        <button onclick="addShape('torus')">Tore</button>
        <button onclick="addShape('cylinder')">Cylindre</button>
        <button onclick="clearScene()">Tout effacer</button>
    </div>
    <div id="canvas-container"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        const canvasContainer = document.getElementById('canvas-container');
        renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
        renderer.setClearColor(0x000000);
        canvasContainer.appendChild(renderer.domElement);

        let isRotating = false;
        let isDraggingArrow = false;
        let selectedArrow = null;
        let previousMousePosition = { x: 0, y: 0 };
        let selectedObject = null;
        let objects = [];
        let arrowGroup = null;

        // Group pour les objets mobiles
        const objectsGroup = new THREE.Group();
        scene.add(objectsGroup);

        // Group fixe pour le plan, grille et axes
        const referenceGroup = new THREE.Group();
        scene.add(referenceGroup);

        // Plan de référence XY (sol) - grille visible
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const planeMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x222222, 
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.8,
            wireframe: true
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = Math.PI / 2;
        referenceGroup.add(plane);
        
        // Grille pour mieux visualiser le plan
        const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x666666);
        gridHelper.rotation.x = Math.PI / 2;
        referenceGroup.add(gridHelper);

        // Repère XYZ
        const axisLength = 3;
        const axisGeometry = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(axisLength, 0, 0)
        ]);
        const axisX = new THREE.Line(axisGeometry, new THREE.LineBasicMaterial({ color: 0xff0000 }));
        referenceGroup.add(axisX);

        const axisYGeometry = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, axisLength, 0)
        ]);
        const axisY = new THREE.Line(axisYGeometry, new THREE.LineBasicMaterial({ color: 0x00ff00 }));
        referenceGroup.add(axisY);

        const axisZGeometry = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, axisLength)
        ]);
        const axisZ = new THREE.Line(axisZGeometry, new THREE.LineBasicMaterial({ color: 0x0000ff }));
        referenceGroup.add(axisZ);

        camera.position.z = 5;

        function createArrow(axis, color) {
            const arrowLength = 1.5;
            const arrowGeometry = new THREE.ConeGeometry(0.1, 0.3, 8);
            const arrowMaterial = new THREE.MeshBasicMaterial({ color: color });
            const arrowHead = new THREE.Mesh(arrowGeometry, arrowMaterial);
            
            let linePoints;
            if (axis === 'X') {
                arrowHead.rotation.z = -Math.PI / 2;
                arrowHead.position.x = arrowLength;
                linePoints = [
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(arrowLength, 0, 0)
                ];
            } else if (axis === 'Y') {
                arrowHead.position.y = arrowLength;
                linePoints = [
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(0, arrowLength, 0)
                ];
            } else if (axis === 'Z') {
                arrowHead.rotation.x = Math.PI / 2;
                arrowHead.position.z = arrowLength;
                linePoints = [
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(0, 0, arrowLength)
                ];
            }
            
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(linePoints);
            const lineMaterial = new THREE.LineBasicMaterial({ color: color });
            const arrowLine = new THREE.Line(lineGeometry, lineMaterial);
            
            const arrow = new THREE.Group();
            arrow.add(arrowLine);
            arrow.add(arrowHead);
            arrow.userData = { axis: axis };
            
            return arrow;
        }

        function updateArrowGroup() {
            if (arrowGroup && selectedObject) {
                arrowGroup.position.copy(selectedObject.position);
                arrowGroup.position.y += 0.75;
            }
        }

        function addShape(type) {
            let mesh, geometry, edgeGeometry;
            
            switch(type) {
                case 'cube':
                    geometry = new THREE.BoxGeometry();
                    break;
                case 'sphere':
                    geometry = new THREE.SphereGeometry(0.5, 32, 32);
                    break;
                case 'torus':
                    geometry = new THREE.TorusGeometry(0.5, 0.2, 16, 100);
                    break;
                case 'cylinder':
                    geometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
                    break;
            }

            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            mesh = new THREE.Mesh(geometry, material);
            mesh.userData.originalColor = 0x00ff00;
            
            edgeGeometry = new THREE.EdgesGeometry(geometry);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x008800 });
            const wireframe = new THREE.LineSegments(edgeGeometry, lineMaterial);
            mesh.add(wireframe);

            mesh.position.y = 0.5;
            objectsGroup.add(mesh);
            objects.push(mesh);
            
            selectObject(mesh);
        }

        function selectObject(object) {
            if (selectedObject) {
                selectedObject.material.color.set(selectedObject.userData.originalColor || 0x00ff00);
            }
            selectedObject = object;
            if (selectedObject) {
                selectedObject.material.color.set(0xffff00);
                
                if (arrowGroup) {
                    objectsGroup.remove(arrowGroup);
                }
                
                arrowGroup = new THREE.Group();
                arrowGroup.add(createArrow('X', 0xff0000));
                arrowGroup.add(createArrow('Y', 0x00ff00));
                arrowGroup.add(createArrow('Z', 0x0000ff));
                objectsGroup.add(arrowGroup);
                updateArrowGroup();
            } else {
                if (arrowGroup) {
                    objectsGroup.remove(arrowGroup);
                    arrowGroup = null;
                }
            }
        }

        function clearScene() {
            while(objectsGroup.children.length > 0) {
                objectsGroup.remove(objectsGroup.children[0]);
            }
            objects = [];
            selectedObject = null;
            arrowGroup = null;
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function getIntersects(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const allObjects = [...objects];
            if (arrowGroup) {
                arrowGroup.children.forEach(arrow => {
                    allObjects.push(arrow);
                });
            }
            
            return raycaster.intersectObjects(allObjects, true);
        }

        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button === 2) {
                isRotating = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            } else if (e.button === 0) {
                const intersects = getIntersects(e);
                if (intersects.length > 0) {
                    const clickedObject = intersects[0].object;
                    
                    if (clickedObject.parent && clickedObject.parent.userData && clickedObject.parent.userData.axis) {
                        selectedArrow = clickedObject.parent;
                        isDraggingArrow = true;
                        previousMousePosition = { x: e.clientX, y: e.clientY };
                    } else {
                        const meshObject = clickedObject.type === 'LineSegments' ? clickedObject.parent : clickedObject;
                        if (objects.includes(meshObject)) {
                            selectObject(meshObject);
                        }
                    }
                }
            }
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isRotating) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                referenceGroup.rotation.y += deltaX * 0.01;
                referenceGroup.rotation.x += deltaY * 0.01;
                objectsGroup.rotation.y += deltaX * 0.01;
                objectsGroup.rotation.x += deltaY * 0.01;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
            
            if (isDraggingArrow && selectedArrow && selectedObject) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                const rect = renderer.domElement.getBoundingClientRect();
                const moveFactor = 10 / rect.width;
                
                const axis = selectedArrow.userData.axis;
                if (axis === 'X') {
                    selectedObject.position.x += deltaX * moveFactor;
                } else if (axis === 'Y') {
                    selectedObject.position.y += deltaY * moveFactor;
                } else if (axis === 'Z') {
                    selectedObject.position.z -= deltaY * moveFactor;
                }
                
                updateArrowGroup();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('mouseup', (e) => {
            if (e.button === 2) {
                isRotating = false;
            }
            if (e.button === 0) {
                isDraggingArrow = false;
                selectedArrow = null;
            }
        });

        renderer.domElement.addEventListener('mouseleave', () => {
            isRotating = false;
            isDraggingArrow = false;
            selectedArrow = null;
        });

        renderer.domElement.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.1 : -0.1;
            camera.position.z += delta;
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
        });

        animate();
    </script>
</body>
</html>
